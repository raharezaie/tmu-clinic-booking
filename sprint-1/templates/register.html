{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="auth">
  <h1>Create your account</h1>
  <p class="lede">For TMU students. You'll need your @torontomu.ca email.</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Full name<input name="full_name" value="{{ request.form.full_name }}" required></label>
    <label>TMU email<input type="email" name="email" value="{{ request.form.email }}" placeholder="you@torontomu.ca" required></label>
    <label>Student number<input name="student_id" value="{{ request.form.student_id }}" inputmode="numeric" pattern="\d{9}" maxlength="9" placeholder="9 digits" required></label>
    <label>Password<input type="password" name="password" minlength="8" required><small>At least 8 characters</small></label>
    <label>Confirm password<input type="password" name="confirm" minlength="8" required></label>
    <button class="btn">Create account</button>
  </form>
  <p class="aside">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}
