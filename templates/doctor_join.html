{% extends "base.html" %}
{% block title %}Doctor sign-up{% endblock %}
{% block content %}
<section class="auth">
  <h1>Set up your doctor account</h1>
  <p class="lede">Clinic staff invited you to TMU Health Booking. Choose a password to finish.</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Name<input value="{{ doctor.full_name }}" readonly></label>
    <label>TMU email<input type="email" value="{{ invite.email }}" readonly></label>
    <label>Password<input type="password" name="password" minlength="8" required autofocus><small>At least 8 characters</small></label>
    <label>Confirm password<input type="password" name="confirm" minlength="8" required></label>
    <button class="btn">Create account</button>
  </form>
  <p class="aside">Name or email wrong? Ask clinic staff to fix it and send you a new link.</p>
</section>
{% endblock %}
