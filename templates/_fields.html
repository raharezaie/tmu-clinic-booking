{# A dropdown of existing values with a "+ Add new" choice that reveals a text box (see base.html script). #}
{% macro addable_select(name, label, options, current='') %}
<label>{{ label }}
  <select name="{{ name }}" data-addable required>
    {% if not current %}<option value="" selected disabled>Choose…</option>{% endif %}
    {% for o in options %}<option {% if o == current %}selected{% endif %}>{{ o }}</option>{% endfor %}
    <option value="__new__">+ Add new {{ label|lower }}…</option>
  </select>
  <input name="{{ name }}_new" maxlength="100" placeholder="New {{ label|lower }}" aria-label="New {{ label|lower }}">
</label>
{% endmacro %}
