{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="auth">
  <h1>Change password</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Current password<input type="password" name="current" required autofocus></label>
    <label>New password<input type="password" name="password" minlength="8" required><small>At least 8 characters</small></label>
    <label>Confirm new password<input type="password" name="confirm" minlength="8" required></label>
    <button class="btn">Change password</button>
  </form>
</section>
{% endblock %}
